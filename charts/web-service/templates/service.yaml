{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "web-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
    {{- if .Values.metrics.enabled }}
    astergaze.io/metrics: "true"
    {{- end }}
spec:
  {{/* ClusterIP always. Public traffic arrives through the Cloudflare Tunnel;
       a LoadBalancer or NodePort here would be a hole in that. */}}
  type: ClusterIP
  selector:
    {{- include "web-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
