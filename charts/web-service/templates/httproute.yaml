{{- if .Values.httpRoute.enabled }}
{{- $fullname := include "web-service.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{/*
    An HTTPRoute with no hostnames matches EVERY host on the listener. The
    platform Gateway sets no hostname of its own, so an empty list here would
    capture other tenants' traffic - _validate.tpl refuses to render that.
  */}}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- if .Values.httpRoute.rules }}
    {{- toYaml .Values.httpRoute.rules | nindent 4 }}
    {{- else }}
    {{/* Default: everything to this service. Spell out `rules` for path splits,
         streaming timeouts or Middleware filters. */}}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
    {{- end }}
{{- end }}
